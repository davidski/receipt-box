name: Sync subpath

# svc-01 (compose-apps) builds receipt-box from the `subpath` branch, since
# Arcane git build contexts only accept branches. Keep it at main.
# Plain push: fails instead of overwriting if subpath ever diverges.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-subpath
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/subpath
